name: Stale

# Flag issues and PRs that have gone quiet, then close them if there's still no
# activity. Anyone can revive one by commenting or removing the `stale` label.
on:
  schedule:
    - cron: "30 1 * * *" # daily, 01:30 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          # Cadence
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale

          # Never auto-stale these — long-lived or important by nature.
          exempt-issue-labels: "epic,security,blocked,priority/critical,pinned,good first issue,help wanted"
          exempt-pr-labels: "epic,security,blocked,priority/critical,pinned"
          exempt-all-milestones: true
          exempt-draft-pr: true

          # Messages
          stale-issue-message: >
            This issue has had no activity for 60 days, so it's been marked
            `stale`. Remove the label or leave a comment to keep it open —
            otherwise it will be closed in 14 days. Thanks for helping keep the
            tracker tidy.
          close-issue-message: >
            Closing after 60 + 14 days without activity. Comment to reopen if
            this is still relevant — no hard feelings.
          stale-pr-message: >
            This pull request has had no activity for 60 days, so it's been
            marked `stale`. Push a commit or comment to keep it open — otherwise
            it will be closed in 14 days.
          close-pr-message: >
            Closing after 60 + 14 days without activity. Reopen anytime once
            you're ready to continue.

          # Be gentle: cap per-run and process oldest first.
          operations-per-run: 60
          ascending: true
