{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubespaces.fullname" . }}-operator
  labels:
    {{- include "kubespaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubespaces.selectorLabels" (dict "ctx" . "component" "operator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubespaces.selectorLabels" (dict "ctx" . "component" "operator") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kubespaces.fullname" . }}-operator
      containers:
        - name: operator
          image: {{ include "kubespaces.image" (dict "ctx" . "image" .Values.operator.image) }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args: ["--leader-elect"]
          {{- /*
            Networking config resolution. The top-level .Values.networking.*
            block is the documented home for the shared domain + gateways; the
            older .Values.operator.tenantApi.* / tenantApps.* keys still work and
            take precedence when set (backward compatible). Each value below is
            "old key if set, else networking default" via `default <fallback> <value>`.
          */}}
          {{- $net := .Values.networking | default dict }}
          {{- $netApiGw := $net.apiGateway | default dict }}
          {{- $netAppsGw := $net.appsGateway | default dict }}
          {{- $ta := .Values.operator.tenantApi | default dict }}
          {{- $taGw := $ta.gateway | default dict }}
          {{- $tapps := .Values.operator.tenantApps | default dict }}
          {{- $tappsGw := $tapps.gateway | default dict }}
          {{- $apiDomain := default $net.domain $ta.domain }}
          {{- $gwName := default $netApiGw.name $taGw.name }}
          {{- $gwNamespace := default $netApiGw.namespace $taGw.namespace }}
          {{- $gwSection := default $netApiGw.sectionName $taGw.sectionName }}
          {{- $extDnsTarget := default $net.externalDnsTarget $ta.externalDnsTarget }}
          {{- $appsDomain := default $net.domain $tapps.domain }}
          {{- $appsGwName := default $netAppsGw.name $tappsGw.name }}
          {{- $appsGwNamespace := default $netAppsGw.namespace $tappsGw.namespace }}
          {{- $appsClusterIssuer := default $net.clusterIssuer $tapps.clusterIssuer }}
          {{- if or .Values.operator.vclusterChartRef .Values.operator.vclusterChartVersion $apiDomain $appsDomain }}
          env:
            {{- with .Values.operator.vclusterChartRef }}
            - name: VCLUSTER_CHART_REF
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.operator.vclusterChartVersion }}
            - name: VCLUSTER_CHART_VERSION
              value: {{ . | quote }}
            {{- end }}
            {{- with $apiDomain }}
            - name: KUBESPACES_API_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- with $gwName }}
            - name: KUBESPACES_GATEWAY_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with $gwNamespace }}
            - name: KUBESPACES_GATEWAY_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- with $gwSection }}
            - name: KUBESPACES_GATEWAY_SECTION
              value: {{ . | quote }}
            {{- end }}
            {{- with $extDnsTarget }}
            - name: KUBESPACES_EXTERNAL_DNS_TARGET
              value: {{ . | quote }}
            {{- end }}
            {{- with $appsDomain }}
            - name: KUBESPACES_APPS_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- with $appsGwName }}
            - name: KUBESPACES_APPS_GATEWAY_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with $appsGwNamespace }}
            - name: KUBESPACES_APPS_GATEWAY_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- with $appsClusterIssuer }}
            - name: KUBESPACES_APPS_CLUSTER_ISSUER
              value: {{ . | quote }}
            {{- end }}
          {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubespaces.fullname" . }}-operator
  labels:
    {{- include "kubespaces.labels" . | nindent 4 }}
---
# The operator provisions vClusters (namespaces, quotas, workloads, RBAC) so it
# carries broad rights for now. TODO: replace with the controller-gen role from
# operator/config/rbac once the surface stabilizes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubespaces.fullname" . }}-operator
  labels:
    {{- include "kubespaces.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ include "kubespaces.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
