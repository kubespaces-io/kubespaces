name: Build & push images

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless signing

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, operator, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          # APP_VERSION is consumed by the frontend image (footer); other
          # components declare no such ARG and harmlessly ignore it.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${REGISTRY}/${{ github.repository_owner }}/${{ matrix.component }}@${DIGEST}"

  # Publish the umbrella chart as a signed OCI artifact, but only on version
  # tags — the quickstart `helm install kubespaces oci://ghcr.io/kubespaces-io/charts/kubespaces`
  # resolves against this. Kept in build.yml (not a separate workflow) to reuse
  # the tag trigger, `packages: write` + `id-token: write` permissions, and the
  # same cosign keyless flow the image jobs use. The chart version tracks the
  # tag via `--version`/`--app-version` so no pre-commit chart bump is required.
  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3

      # Authenticate the Docker config (~/.docker/config.json), which BOTH
      # `helm push` and `cosign` read — `helm registry login` only writes
      # helm's own store, leaving cosign unauthenticated to push the signature.
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push chart
        id: push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"   # v0.8.0 -> 0.8.0
          helm package charts/kubespaces --version "${TAG}" --app-version "${TAG}"
          # helm push prints the pushed digest to stderr; capture it so cosign
          # signs the exact manifest we published (digest, not the mutable tag).
          helm push "kubespaces-${TAG}.tgz" "oci://${REGISTRY}/${OWNER}/charts" \
            2>&1 | tee push.log
          DIGEST="$(awk '/Digest:/ {print $2}' push.log)"
          test -n "${DIGEST}" || { echo "could not parse pushed chart digest"; exit 1; }
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Sign chart (cosign keyless)
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${REGISTRY}/${OWNER}/charts/kubespaces@${DIGEST}"
